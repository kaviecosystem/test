<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplier</title>
<style>
html,body{margin:0;height:100%;background:#0B0E1A}
#__mxbar{position:fixed;top:0;left:0;right:0;z-index:99999;display:flex;gap:8px;
 padding:9px 12px;background:#0B0E1A;border-bottom:1px solid #252D48;box-sizing:border-box;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#__mxbar button{flex:1;max-width:260px;padding:10px 14px;border:1px solid #252D48;
 border-radius:10px;background:#131829;color:#7C84A3;font-size:13px;font-weight:600;
 letter-spacing:.02em;cursor:pointer;transition:color .15s,background .15s,border-color .15s;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#__mxbar button:hover{color:#E9ECF6}
#__mxbar button.active{color:#0B0E1A;background:#F0B429;border-color:#F0B429}
#__mxsub{position:fixed;top:56px;left:0;right:0;z-index:99998;display:none;gap:8px;
 padding:7px 12px;background:#0B0E1A;border-bottom:1px solid #252D48;box-sizing:border-box;
 font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#__mxsub .sublabel{align-self:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
 color:#7C84A3;font-family:system-ui,sans-serif;padding-right:2px}
#__mxsub button{flex:1;max-width:200px;padding:8px 12px;border:1px solid #252D48;
 border-radius:9px;background:#131829;color:#7C84A3;font-size:12px;font-weight:600;
 letter-spacing:.02em;cursor:pointer;transition:color .15s,background .15s,border-color .15s;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#__mxsub button:hover{color:#E9ECF6}
#__mxsub button.active{color:#0B0E1A;background:#2DD4A7;border-color:#2DD4A7}
#__frame{position:fixed;top:56px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 56px);border:0;display:block}
@media(max-width:560px){
 #__mxbar{padding:8px}#__mxbar button{padding:10px 8px;font-size:12px}
 #__mxsub{padding:6px 8px}#__mxsub button{padding:8px 6px;font-size:11px}
 #__mxsub .sublabel{display:none}
}
</style>
</head>

  layout();
  var doc=dec(PAGES[k]);
  doc=doc.replace(/<head([^>]*)>/i, "<head$1>"+WALLET_SHIM+REF_SHIM+AUTOCONNECT_SHIM);
  if(/<\/body>/i.test(doc)){ doc=doc.replace(/<\/body>/i, ERR_SHIM+"</body>"); } else { doc=doc+ERR_SHIM; }
  frame.srcdoc=doc;
}

topBtns.forEach(function(btn){
  btn.addEventListener("click",function(){
    var dk=btn.getAttribute("data-k");
    var target=GROUPS[dk]?lastInGroup[dk]:dk;
    if(target===key)return;
    location.hash=target;
  });
});
window.addEventListener("hashchange",function(){
  var k=(location.hash||"").replace(/^#/,"");
  if(!PAGES[k])k="kavinew";
  load(k);
});
window.addEventListener("resize",layout);
load(key);
</script>
