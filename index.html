function dec(b){var s=atob(b);var u=Uint8Array.from(s,function(c){return c.charCodeAt(0);});return new TextDecoder("utf-8").decode(u);}
var frame=document.getElementById("__frame");
var btns=Array.prototype.slice.call(document.querySelectorAll("#__mxbar button"));
var key=(location.hash||"").replace(/^#/,"");
if(!PAGES[key])key="kavi";
// A srcdoc iframe is same-origin with this parent, but the wallet extension
// injects window.ethereum only into the TOP frame. This shim borrows the parent's
// provider so window.ethereum works inside the page. (Guarded + briefly polled in
// case the extension injects a moment late.)
var WALLET_SHIM = '<script>(function(){function grab(){try{if(!window.ethereum&&window.parent&&window.parent!==window&&window.parent.ethereum){window.ethereum=window.parent.ethereum;return true;}}catch(e){}return !!window.ethereum;}if(!grab()){var n=0,t=setInterval(function(){n++;if(grab()||n>50)clearInterval(t);},100);}})();<\/script>';
function load(k){
  key=k;
  btns.forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-k")===k); });
  var doc=dec(PAGES[k]);
  doc=doc.replace(/<head([^>]*)>/i, "<head$1>"+WALLET_SHIM);
  frame.srcdoc=doc;
}
btns.forEach(function(btn){
  btn.addEventListener("click",function(){
    var k=btn.getAttribute("data-k");
    if(k===key)return;
    location.hash=k;
  });
});
window.addEventListener("hashchange",function(){
  var k=(location.hash||"").replace(/^#/,"");
  if(!PAGES[k])k="kavi";
  load(k);
});
load(key);
</script>
